<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Story of Art</title>
    <meta name="description" content="The Story of Art, an animated text-based wall projection by Emma Kay, made with e-2. Shown at Tate Modern, London, and the Power Plant, Toronto.">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        /* the 1024x768 projection, scaled to fit */
        #projection {
            display: block;
            width: 100%;
            height: 100%;
        }
        #screen {
            fill: #fff;
        }
        /* the text is drawn with the glyphs of the original SVG font, as paths (player.js) */
        #stage {
            fill: #000;
        }
        #debug {
            position: fixed;
            left: 10px;
            bottom: 10px;
            font: 14px monospace;
            color: #0a0;
        }
        body.capture #debug {
            display: none;
        }
        /* fullscreen button: shown when the mouse moves, hidden again (with the pointer) after a few seconds */
        .fullscreen-btn {
            position: fixed;
            z-index: 1;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            padding: 2px;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s;
        }
        body.idle {
            cursor: none;
        }
        body.idle .fullscreen-btn:not(:focus-visible) {
            opacity: 0;
            pointer-events: none;
        }
        body.capture .fullscreen-btn {
            display: none;
        }
        .fullscreen-btn svg {
            display: block;
        }
        .fullscreen-btn path {
            fill: none;
            stroke: hsl(225, 10%, 8%);
            stroke-width: 4;
        }
        .fullscreen-btn:not(.on) .icon-leave,
        .fullscreen-btn.on .icon-enter {
            display: none;
        }
    </style>
</head>
<body>
    <svg id="projection" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid meet" aria-label="The Story of Art by Emma Kay" role="img">
        <defs>
            <clipPath id="screen-clip"><rect width="1024" height="768"/></clipPath>
        </defs>
        <g clip-path="url(#screen-clip)">
            <rect id="screen" width="1024" height="768"/>
            <g id="stage"></g>
        </g>
    </svg>
    <div id="debug" hidden></div>
    <button class="fullscreen-btn" aria-label="Enter fullscreen" hidden>
        <svg width="28" height="28" viewBox="-2 -2 28 28" aria-hidden="true">
            <g class="icon-enter"><path d="M 2 9 v -7 h 7"/><path d="M 22 9 v -7 h -7"/><path d="M 22 15 v 7 h -7"/><path d="M 2 15 v 7 h 7"/></g>
            <g class="icon-leave"><path d="M 24 17 h -7 v 7"/><path d="M 0 17 h 7 v 7"/><path d="M 0 7 h 7 v -7"/><path d="M 24 7 h -7 v -7"/></g>
        </svg>
    </button>
    <script src="player.js"></script>
    <script>
    /**
     * Plays the piece in real time. URL options:
     *   ?t=2h15m30s  start at that point (or plain seconds)
     *   ?debug       show the time
     *   ?aspect=5:3  mask the top and bottom, as the projection was at the Tate
     *   ?capture     don't play - scripts/capture.js renders frames with player.renderAt()
     * While playing: space pauses, left/right skip 10 seconds (60 with shift),
     * f toggles fullscreen (as does the button which appears when the mouse moves)
     */
    function parseTime(str) {
        if (!str) return 0;
        if (/^[\d.]+$/.test(str)) return parseFloat(str) * 1000;
        const part = unit => parseFloat((str.match(new RegExp('([\\d.]+)' + unit)) || [, 0])[1]);
        return (part('h') * 3600 + part('m') * 60 + part('s')) * 1000;
    }
    function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    const params = new URLSearchParams(location.search);
    /* masking: show a band of the 1024x768 composition with the given aspect ratio */
    const aspect = (params.get('aspect') || '4:3').split(':').map(Number);
    if (aspect.length === 2 && aspect[0] > 0 && aspect[1] > 0) {
        const h = Math.min(768, 1024 * aspect[1] / aspect[0]);
        document.getElementById('projection').setAttribute('viewBox', '0 ' + ((768 - h) / 2) + ' 1024 ' + h);
    }
    window.playerReady = fetch('timeline.json').then(r => r.json()).then(timeline => {
        const player = new StoryOfArt(document.getElementById('stage'), timeline);
        window.player = player;
        if (params.has('capture')) {
            document.body.classList.add('capture');
            return player;
        }
        const debug = params.has('debug') ? document.getElementById('debug') : null;
        if (debug) debug.hidden = false;
        let offset = parseTime(params.get('t'));
        let startedAt = performance.now();
        const now = () => startedAt === null ? offset : offset + performance.now() - startedAt;
        /* fullscreen */
        const fullscreenBtn = document.querySelector('.fullscreen-btn');
        const toggleFullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (document.fullscreenEnabled) {
            fullscreenBtn.hidden = false;
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const on = !!document.fullscreenElement;
                fullscreenBtn.classList.toggle('on', on);
                fullscreenBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
            });
        }
        let idleTimer;
        const wake = () => {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
        };
        ['mousemove', 'mousedown', 'touchstart'].forEach(type => document.addEventListener(type, wake));
        wake();

        document.addEventListener('keydown', e => {
            if (e.key === 'f' && document.fullscreenEnabled) {
                toggleFullscreen();
            } else if (e.key === ' ') {
                if (startedAt === null) {
                    startedAt = performance.now();
                } else {
                    offset = now();
                    startedAt = null;
                }
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                offset = Math.max(0, now() + (e.shiftKey ? 60000 : 10000) * (e.key === 'ArrowLeft' ? -1 : 1));
                if (startedAt !== null) startedAt = performance.now();
            }
        });
        (function frame() {
            const t = now();
            player.renderAt(t);
            if (debug) debug.textContent = formatTime(t % player.duration) + (startedAt === null ? ' (paused)' : '');
            requestAnimationFrame(frame);
        })();
        return player;
    });
    </script>
</body>
</html>
