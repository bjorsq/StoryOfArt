<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Story of Art</title>
    <meta name="description" content="The Story of Art, an animated text-based wall projection by Emma Kay, made with e-2. Shown at Tate Modern, London, and the Power Plant, Toronto.">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        /* the 1024x768 projection, scaled to fit */
        #projection {
            display: block;
            width: 100%;
            height: 100%;
        }
        #screen {
            fill: #fff;
        }
        /* the text is drawn with the glyphs of the original SVG font, as paths (player.js) */
        #stage {
            fill: #000;
        }
        #debug {
            position: fixed;
            left: 10px;
            bottom: 10px;
            font: 14px monospace;
            color: #0a0;
        }
        body.capture #debug {
            display: none;
        }
        /* fullscreen and screenshot buttons: shown when the mouse moves, hidden again (with the pointer) after a few seconds */
        .control-btn {
            position: fixed;
            z-index: 1;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            padding: 2px;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s;
        }
        body.idle {
            cursor: none;
        }
        .screenshot-btn {
            top: 52px;
        }
        body.idle .control-btn:not(:focus-visible) {
            opacity: 0;
            pointer-events: none;
        }
        body.capture .control-btn {
            display: none;
        }
        .control-btn svg {
            display: block;
        }
        .control-btn path,
        .control-btn circle {
            fill: none;
            stroke: hsl(225, 10%, 8%);
            stroke-width: 4;
        }
        .screenshot-btn path,
        .screenshot-btn circle {
            stroke-width: 2.5;
            stroke-linejoin: round;
        }
        /* the camera flash */
        @keyframes flash {
            from { opacity: 0.9; }
            to { opacity: 0; }
        }
        #flash {
            position: fixed;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
        }
        #flash.flash {
            animation: flash 0.4s ease-out;
        }
        .fullscreen-btn:not(.on) .icon-leave,
        .fullscreen-btn.on .icon-enter {
            display: none;
        }
    </style>
</head>
<body>
    <svg id="projection" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid meet" aria-label="The Story of Art by Emma Kay" role="img">
        <defs>
            <clipPath id="screen-clip"><rect width="1024" height="768"/></clipPath>
        </defs>
        <g clip-path="url(#screen-clip)">
            <rect id="screen" width="1024" height="768"/>
            <g id="stage"></g>
        </g>
    </svg>
    <div id="debug" hidden></div>
    <button class="control-btn fullscreen-btn" aria-label="Enter fullscreen" hidden>
        <svg width="28" height="28" viewBox="-2 -2 28 28" aria-hidden="true">
            <g class="icon-enter"><path d="M 2 9 v -7 h 7"/><path d="M 22 9 v -7 h -7"/><path d="M 22 15 v 7 h -7"/><path d="M 2 15 v 7 h 7"/></g>
            <g class="icon-leave"><path d="M 24 17 h -7 v 7"/><path d="M 0 17 h 7 v 7"/><path d="M 0 7 h 7 v -7"/><path d="M 24 7 h -7 v -7"/></g>
        </svg>
    </button>
    <button class="control-btn screenshot-btn" aria-label="Take a screenshot" title="Take a screenshot">
        <svg width="28" height="28" viewBox="-2 -2 28 28" aria-hidden="true">
            <path d="M 2 7 h 5 l 2 -3 h 6 l 2 3 h 5 v 13 h -20 z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>
    </button>
    <div id="flash" aria-hidden="true"></div>
    <script src="player.js"></script>
    <script>
    /**
     * Plays the piece in real time. URL options:
     *   ?t=2h15m30s  start at that point (or plain seconds)
     *   ?debug       show the time
     *   ?aspect=5:3  mask the top and bottom, as the projection was at the Tate
     *   ?capture     don't play - scripts/capture.js renders frames with player.renderAt()
     * While playing: space pauses, left/right skip 10 seconds (60 with shift),
     * f toggles fullscreen (as does the button which appears when the mouse
     * moves), and the camera button under it saves a screenshot
     */
    function parseTime(str) {
        if (!str) return 0;
        if (/^[\d.]+$/.test(str)) return parseFloat(str) * 1000;
        const part = unit => parseFloat((str.match(new RegExp('([\\d.]+)' + unit)) || [, 0])[1]);
        return (part('h') * 3600 + part('m') * 60 + part('s')) * 1000;
    }
    function formatTime(ms) {
        const s = Math.floor(ms / 1000);
        return Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    const params = new URLSearchParams(location.search);
    /* masking: show a band of the 1024x768 composition with the given aspect ratio */
    const aspect = (params.get('aspect') || '4:3').split(':').map(Number);
    if (aspect.length === 2 && aspect[0] > 0 && aspect[1] > 0) {
        const h = Math.min(768, 1024 * aspect[1] / aspect[0]);
        document.getElementById('projection').setAttribute('viewBox', '0 ' + ((768 - h) / 2) + ' 1024 ' + h);
    }
    window.playerReady = fetch('timeline.json').then(r => r.json()).then(timeline => {
        const player = new StoryOfArt(document.getElementById('stage'), timeline);
        window.player = player;
        if (params.has('capture')) {
            document.body.classList.add('capture');
            return player;
        }
        const debug = params.has('debug') ? document.getElementById('debug') : null;
        if (debug) debug.hidden = false;
        let offset = parseTime(params.get('t'));
        let startedAt = performance.now();
        const now = () => startedAt === null ? offset : offset + performance.now() - startedAt;
        /* fullscreen */
        const fullscreenBtn = document.querySelector('.fullscreen-btn');
        const toggleFullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (document.fullscreenEnabled) {
            fullscreenBtn.hidden = false;
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('fullscreenchange', () => {
                const on = !!document.fullscreenElement;
                fullscreenBtn.classList.toggle('on', on);
                fullscreenBtn.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
            });
        }
        /**
         * Screenshots: the projection is one SVG, with the letters drawn as paths, so it's
         * drawn onto a canvas at twice the composition's resolution and saved as a PNG
         * named after the moment in the piece, with a shutter sound and a flash
         */
        const flashEl = document.getElementById('flash');
        let audio;
        function shutter() {
            try {
                audio = audio || new (window.AudioContext || window.webkitAudioContext)();
                const noise = audio.createBuffer(1, audio.sampleRate * 0.1, audio.sampleRate);
                const data = noise.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                [[0, 2500, 0.9], [0.09, 1800, 0.6]].forEach(([at, freq, level]) => {
                    const t = audio.currentTime + at;
                    const source = audio.createBufferSource();
                    source.buffer = noise;
                    const filter = audio.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = freq;
                    filter.Q.value = 0.8;
                    const gain = audio.createGain();
                    gain.gain.setValueAtTime(level, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                    source.connect(filter).connect(gain).connect(audio.destination);
                    source.start(t);
                    source.stop(t + 0.08);
                });
            } catch (e) {}
        }
        function screenshot() {
            const t = now() % player.duration;
            shutter();
            flashEl.classList.remove('flash');
            void flashEl.offsetWidth;
            flashEl.classList.add('flash');
            const svg = document.getElementById('projection');
            const box = svg.viewBox.baseVal;
            const width = box.width * 2;
            const height = Math.round(box.height * 2);
            const clone = svg.cloneNode(true);
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            /* the colours come from the page's stylesheet, which the image won't have */
            clone.querySelector('#screen').setAttribute('fill', '#fff');
            clone.querySelector('#stage').setAttribute('fill', '#000');
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob(blob => {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    const s = Math.floor(t / 1000);
                    link.download = 'story-of-art-' + String(Math.floor(s / 3600)).padStart(2, '0') + 'h' + String(Math.floor(s / 60) % 60).padStart(2, '0') + 'm' + String(s % 60).padStart(2, '0') + 's.png';
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
                }, 'image/png');
            };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
        }
        document.querySelector('.screenshot-btn').addEventListener('click', screenshot);

        let idleTimer;
        const wake = () => {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
        };
        ['mousemove', 'mousedown', 'touchstart'].forEach(type => document.addEventListener(type, wake));
        wake();

        document.addEventListener('keydown', e => {
            if (e.key === 'f' && document.fullscreenEnabled) {
                toggleFullscreen();
            } else if (e.key === ' ') {
                if (startedAt === null) {
                    startedAt = performance.now();
                } else {
                    offset = now();
                    startedAt = null;
                }
                e.preventDefault();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                offset = Math.max(0, now() + (e.shiftKey ? 60000 : 10000) * (e.key === 'ArrowLeft' ? -1 : 1));
                if (startedAt !== null) startedAt = performance.now();
            }
        });
        (function frame() {
            const t = now();
            player.renderAt(t);
            if (debug) debug.textContent = formatTime(t % player.duration) + (startedAt === null ? ' (paused)' : '');
            requestAnimationFrame(frame);
        })();
        return player;
    });
    </script>
</body>
</html>
